name: Provision infra

on:
  push:
    branches: [main]
    paths:
      - tofu/**
      - .github/workflows/provision.yml
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the saved plan. Leave false for plan-only.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-infra
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
      SSH_PUBLIC_KEY: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_dns_zone: ${{ vars.DNS_ZONE }}
      TF_VAR_ses_dkim_tokens: ${{ vars.SES_DKIM_TOKENS }}
      TF_VAR_ssh_public_key_path: /tmp/yz-infra-ssh.pub
      TF_VAR_ssh_source_cidrs: "[]"
      TF_VAR_tailscale_authkey: ${{ secrets.TF_VAR_TAILSCALE_AUTHKEY }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
      PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.TF_STATE_REGION }}
          role-session-name: yz-infra-tofu

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.13.9

      - name: Prepare backend and public key
        run: |
          set -euo pipefail
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$TF_VAR_ssh_public_key_path"
          cat > "$RUNNER_TEMP/backend.tfvars" <<EOF
          bucket = "$TF_STATE_BUCKET"
          key    = "yz-infra/terraform.tfstate"
          region = "$TF_STATE_REGION"
          encrypt = true
          use_lockfile = true
          EOF

      - name: Init, validate, plan
        run: |
          set -euo pipefail
          tofu -chdir=tofu init -backend-config="$RUNNER_TEMP/backend.tfvars" -input=false -no-color
          tofu -chdir=tofu fmt -check -recursive
          tofu -chdir=tofu validate -no-color
          tofu -chdir=tofu plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: |
          set -euo pipefail
          tofu -chdir=tofu apply -input=false -no-color tfplan

      - name: Show outputs
        run: tofu -chdir=tofu output -no-color
