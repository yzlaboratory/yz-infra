name: example

services:
  app:
    image: ${IMAGE_REF:?set IMAGE_REF to a pinned image, e.g. ghcr.io/org/example:sha-abc1234}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${APP_PORT:-3000}"
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "proxy"
      traefik.http.routers.example.rule: "Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)"
      traefik.http.routers.example.entrypoints: "websecure"
      traefik.http.routers.example.tls.certresolver: "letsencrypt"
      traefik.http.routers.example.middlewares: "security-headers@file,compress@file"
      traefik.http.services.example.loadbalancer.server.port: "${APP_PORT:-3000}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
